name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # typecheck, lint, unit tests, formatting (scripts/check.mjs)
      - run: pnpm check

      # Every migration must apply from scratch, as `db push` will apply them to the mini-PC.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0

      - name: Rebuild the database from migrations
        run: |
          supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,realtime,storage-api
          supabase db reset
